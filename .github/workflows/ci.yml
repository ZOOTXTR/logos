name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  test:
    name: Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  android-build:
    name: Android AAB Build (Local Gradle)
    # NOT: Bu iş, `google-services.json` ve `release.keystore` dosyalarına ihtiyaç duyar;
    # ikisi de gitignore'lu (özel) olduğu için normal push'ta derlenemez. Etkinleştirmek için:
    #   1) `GOOGLE_SERVICES_JSON` (base64) repo secret'ı ekleyip aşağıda dosyaya yazın,
    #   2) keystore'u base64 secret olarak ekleyip signingConfig'i sağlayın.
    # Şimdilik yalnızca manuel tetiklemede (workflow_dispatch) çalışır.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci --legacy-peer-deps
      - run: npx expo prebuild --platform android --clean
      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
